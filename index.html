<body class="i18n-loading">

    <nav id="main-nav">

                <button class="lang-btn" data-lang="nl">NL</button>

    <div class="mobile-drawer" id="mobile-drawer" aria-hidden="true">
        <a href="#about" data-i18n="nav.about" onclick="closeDrawer()"></a>
        <a href="#portfolio" data-i18n="nav.portfolio" onclick="closeDrawer()"></a>
        <a href="#occasions" data-i18n="nav.occasions" onclick="closeDrawer()"></a>
        <a href="#instagram" data-i18n="nav.instagram" onclick="closeDrawer()"></a>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" tabindex="-1">
        <div class="lightbox-backdrop" id="lb-backdrop"></div>
        <button class="lightbox-close" id="lb-close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
            <span id="lb-close-label">Sluiten</span>
        </button>
        <button class="lightbox-prev" id="lb-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.5">
                <polyline points="15 18 9 12 15 6" />
            </svg></button>
        <div class="lightbox-content">
            <div class="lightbox-img-wrap" id="lb-img-wrap"></div>
            <p class="lightbox-caption" id="lb-caption"></p>
        </div>
        <button class="lightbox-next" id="lb-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.5">
                <polyline points="9 18 15 12 9 6" />
            </svg></button>
        <div class="lightbox-counter" id="lb-counter"></div>
    </div>

            </div>
        </div>
        <div class="hero-visual">
            <img src="images/portrait.jpg" style="width:100%; height: 100%;" alt="Botanick">

    <section id="about">

        <div class="about-text">

            <p class="section-body fade-up" data-i18n="about.body2"></p>
        </div>

    <!-- PORTFOLIO
    HOW TO ADD IMAGES: drop an <img> inside the .service-img element.
    The lightbox reads src and uses the data-caption-i18n key for the translated caption.
    Example:
      <div class="service-img" data-lightbox="portfolio" data-caption-i18n="portfolio.wedding.title">
        <img src="images/weddings.jpg" />
      </div>
  -->

            <div class="service-card card-xmas fade-up">

                    <img src="images/christmas.jpg" style="width:100%; height: 100%;" alt="Botanick">
                    <!-- <span class="service-img-label" data-i18n="occasions.christmas"></span> -->
                    <span class="lb-zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                            <line x1="21" y1="21" x2="16.65" y2="16.65" />

        </div>
        <div class="occasions-tabs">
            <button class="tab-btn active" data-tab="weddings" data-i18n="occasions.weddings"></button>

            <button class="tab-btn" data-tab="christmas" data-i18n="occasions.christmas"></button>
            <button class="tab-btn" data-tab="corporate" data-i18n="occasions.corporate"></button>

    <section id="instagram">
        <div class="instagram-header">
            <span class="section-label" data-i18n="instagram.label"></span>
            <h2 class="section-title" data-i18n="instagram.title"></h2>
            <a href="https://instagram.com/botanick_be" target="_blank" rel="noopener" class="instagram-handle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="2" y="2" width="20" height="20" rx="5" />
                    <circle cx="12" cy="12" r="4" />
                    <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
                </svg>
                @botanick_be
            </a>
        </div>
        <div class="instagram-grid" id="ig-grid"></div>
        <p class="insta-note" data-i18n="[html]instagram.note"></p>
    </section>

    <section id="contact">
        <div>
            <span class="section-label" data-i18n="contact.label"></span>
            <h2 class="section-title" style="color:var(--cream)" data-i18n="[html]contact.title"></h2>
            <div class="divider"></div>
            <p class="section-body" data-i18n="contact.body"></p>
            <div class="contact-details">
                <p><strong data-i18n="contact.emailLabel"></strong><br><a
                        href="mailto:contact@botanick.be">contact@botanick.be</a></p>
                <p><strong>Instagram</strong><br><a href="https://instagram.com/botanick_be">@botanick_be</a></p>
                <p><strong>Pinterest</strong><br><a href="https://pinterest.com/botanick_be">@botanick_be</a></p>
                <p><strong data-i18n="contact.basedLabel"></strong><br><span data-i18n="contact.based"></span></p>
            </div>
        </div>
        <div class="contact-form">
            <div class="form-group"><label data-i18n="form.name"></label><input type="text"
                    data-i18n="[placeholder]form.namePh" /></div>
            <div class="form-group"><label data-i18n="form.email"></label><input type="email"
                    data-i18n="[placeholder]form.emailPh" /></div>
            <div class="form-group">
                <label data-i18n="form.occasion"></label>
                <select>
                    <option value="" data-i18n="form.occasionPh"></option>
                    <option data-i18n="occasions.weddings"></option>
                    <option data-i18n="occasions.seasonal"></option>
                    <option data-i18n="occasions.christmas"></option>
                    <option data-i18n="occasions.corporate"></option>
                    <option data-i18n="occasions.funerals"></option>
                    <option data-i18n="form.other"></option>
                </select>
            </div>
            <div class="form-group"><label data-i18n="form.message"></label><textarea
                    data-i18n="[placeholder]form.messagePh"></textarea></div>
            <button class="btn-submit" onclick="handleFormSubmit(event)" data-i18n="form.submit"></button>
        </div>
    </section>

    <footer>
        <span class="footer-logo">Botanick</span>
        <ul class="footer-links">
            <li><a href="#about" data-i18n="nav.about"></a></li>
            <li><a href="#portfolio" data-i18n="nav.portfolio"></a></li>
            <li><a href="#occasions" data-i18n="nav.occasions"></a></li>
            <li><a href="#instagram" data-i18n="nav.instagram"></a></li>
            <li><a href="#contact" data-i18n="nav.contact2"></a></li>
        </ul>
        <span style="opacity:.45" data-i18n="footer.copy"></span>
    </footer>
