<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botanick</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --moss: #3d4a2e;
            --sage: #7a8c6a;
            --cream: #f5f0e8;
            --linen: #ece6d9;
            --bark: #8c6f52;
            --petal: #c9a98a;
            --earth: #2a2018;
            --mist: #b8c4a8;
            --white: #faf8f4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            font-family: 'Jost', sans-serif;
            background: var(--cream);
            color: var(--earth);
            font-weight: 300;
            overflow-x: hidden
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1000;
            opacity: .4
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.4rem 4rem;
            background: rgba(245, 240, 232, .88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(122, 140, 106, .15);
            transition: padding .3s, background .3s
        }

        nav.scrolled {
            padding: 1rem 4rem;
            background: rgba(245, 240, 232, .97)
        }

        .nav-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: .15em;
            color: var(--moss);
            text-decoration: none;
            flex-shrink: 0
        }

        .nav-logo span {
            font-style: italic;
            font-weight: 300
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 2rem
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none
        }

        .nav-links a {
            text-decoration: none;
            color: var(--earth);
            font-size: .78rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            transition: color .2s;
            position: relative
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--sage);
            transition: width .3s
        }

        .nav-links a:hover {
            color: var(--moss)
        }

        .nav-links a:hover::after {
            width: 100%
        }

        .nav-cta {
            background: var(--moss);
            color: var(--cream) !important;
            padding: .55rem 1.4rem
        }

        .nav-cta::after {
            display: none !important
        }

        .nav-cta:hover {
            background: var(--sage) !important
        }

        /* LANG */
        .lang-switcher {
            display: flex;
            border: 1px solid rgba(122, 140, 106, .3);
            overflow: hidden;
            flex-shrink: 0
        }

        .lang-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Jost', sans-serif;
            font-size: .65rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--sage);
            padding: .38rem .7rem;
            transition: background .2s, color .2s;
            position: relative
        }

        .lang-btn+.lang-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            bottom: 20%;
            width: 1px;
            background: rgba(122, 140, 106, .3)
        }

        .lang-btn.active {
            background: var(--moss);
            color: var(--cream)
        }

        .lang-btn:hover:not(.active) {
            background: var(--linen);
            color: var(--moss)
        }

        /* HAMBURGER */
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            flex-shrink: 0;
            z-index: 200
        }

        .hamburger span {
            display: block;
            width: 22px;
            height: 1.5px;
            background: var(--moss);
            transition: transform .3s, opacity .2s
        }

        .hamburger.open span:nth-child(1) {
            transform: translateY(6.5px) rotate(45deg)
        }

        .hamburger.open span:nth-child(2) {
            opacity: 0
        }

        .hamburger.open span:nth-child(3) {
            transform: translateY(-6.5px) rotate(-45deg)
        }

        /* DRAWER */
        .mobile-drawer {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--cream);
            z-index: 99;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 2rem
        }

        .mobile-drawer.open {
            display: flex
        }

        .mobile-drawer a {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: var(--moss);
            text-decoration: none;
            letter-spacing: .06em;
            transition: color .2s;
            text-align: center
        }

        .mobile-drawer a:hover {
            color: var(--bark)
        }

        .mobile-drawer .mobile-cta {
            font-family: 'Jost', sans-serif;
            font-size: .8rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            background: var(--moss);
            color: var(--cream) !important;
            padding: .9rem 2.8rem;
            margin-top: .5rem
        }

        .mobile-drawer .lang-switcher {
            margin-top: 1.5rem
        }

        .mobile-drawer .lang-btn {
            padding: .5rem 1rem;
            font-size: .72rem
        }

        /* HERO */
        #hero {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding-top: 80px
        }

        .hero-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 6rem 4rem 6rem 6rem
        }

        .hero-eyebrow {
            font-size: .72rem;
            letter-spacing: .25em;
            text-transform: uppercase;
            color: var(--sage);
            margin-bottom: 1.5rem
        }

        .hero-title {
            font-size: clamp(3.5rem, 5vw, 6rem);
            line-height: 1.05;
            color: var(--moss);
            margin-bottom: 1.8rem
        }

        .hero-title em {
            font-style: italic;
            color: var(--bark)
        }

        .hero-sub {
            font-size: 1rem;
            line-height: 1.75;
            color: var(--sage);
            max-width: 38ch;
            margin-bottom: 3rem
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: .8rem
        }

        .btn-primary {
            display: inline-block;
            background: var(--moss);
            color: var(--cream);
            text-decoration: none;
            padding: .9rem 2.4rem;
            font-family: 'Jost', sans-serif;
            font-size: .78rem;
            letter-spacing: .15em;
            text-transform: uppercase;
            transition: background .3s, transform .2s
        }

        .btn-primary:hover {
            background: var(--sage);
            transform: translateY(-1px)
        }

        .btn-outline {
            display: inline-block;
            border: 1px solid var(--moss);
            color: var(--moss);
            text-decoration: none;
            padding: .85rem 2.2rem;
            font-family: 'Jost', sans-serif;
            font-size: .78rem;
            letter-spacing: .15em;
            text-transform: uppercase;
            transition: background .3s, color .3s
        }

        .btn-outline:hover {
            background: var(--moss);
            color: var(--cream)
        }

        .hero-visual {
            position: relative;
            overflow: hidden;
            background: var(--linen)
        }

        .hero-visual img {
            height: 100%;
            width: 100%;
            object-fit: cover;
        }

        .hero-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--linen) 0%, var(--mist) 50%, var(--linen) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem
        }

        .hero-img-hint {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: var(--sage);
            font-size: 1.1rem;
            opacity: .6
        }

        /* SHARED */
        section {
            padding: 6rem;
            position: relative
        }

        .section-label {
            font-size: .7rem;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: var(--petal);
            margin-bottom: 1rem;
            display: block
        }

        .section-title {
            font-size: clamp(2.2rem, 3.5vw, 3.8rem);
            color: var(--moss);
            margin-bottom: 1.5rem;
            line-height: 1.15
        }

        .section-body {
            font-size: 1rem;
            line-height: 1.85;
            color: var(--sage);
            max-width: 55ch
        }

        .divider {
            width: 60px;
            height: 1px;
            background: var(--mist);
            margin: 2rem 0
        }

        /* ABOUT */
        #about {
            background: var(--white);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5rem;
            align-items: center;
            padding: 7rem 6rem
        }

        .about-img-frame {
            position: relative
        }

        .about-img-box {
            width: 100%;
            aspect-ratio: 3/4;
            background: linear-gradient(160deg, var(--mist), var(--linen));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden
        }

        .about-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .about-img-caption {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: var(--sage);
            font-size: 1rem;
            opacity: .5
        }

        .about-accent-box {
            position: absolute;
            bottom: -20px;
            right: -20px;
            width: 60%;
            height: 60%;
            border: 1px solid var(--mist);
            z-index: -1
        }

        .about-text {
            padding-left: 2rem
        }

        .about-quote {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-style: italic;
            color: var(--bark);
            line-height: 1.5;
            border-left: 2px solid var(--mist);
            padding-left: 1.5rem;
            margin: 2rem 0
        }

        /* PORTFOLIO */
        #portfolio {
            background: var(--cream)
        }

        .portfolio-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 3.5rem
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem
        }

        .service-card {
            background: var(--white);
            overflow: hidden;
            transition: transform .3s
        }

        .service-card:hover {
            transform: translateY(-4px)
        }

        .service-card:first-child {
            grid-column: span 2
        }

        .service-img {
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden
        }

        .service-card:first-child .service-img {
            aspect-ratio: 21/9
        }

        .service-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .service-img-label {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.3rem;
            color: var(--sage);
            opacity: .5;
            position: absolute;
            pointer-events: none
        }

        .card-wedding .service-img {
            background: linear-gradient(135deg, #c5ceba, #dde3d4)
        }

        .card-seasonal .service-img {
            background: linear-gradient(135deg, #cfc4a8, #e5dcc9)
        }

        .card-xmas .service-img {
            background: linear-gradient(135deg, #b8c4a8, #d4dfc8)
        }

        .card-corp .service-img {
            background: linear-gradient(135deg, #c4b8a8, #ddd4c5)
        }

        .card-funeral .service-img {
            background: linear-gradient(135deg, #b8bec4, #d0d5dc)
        }

        .service-info {
            padding: 1.5rem;
            border-top: 1px solid var(--linen)
        }

        .service-info h3 {
            font-size: 1.3rem;
            color: var(--moss);
            margin-bottom: .4rem
        }

        .service-info p {
            font-size: .85rem;
            color: var(--sage);
            line-height: 1.6
        }

        .service-tag {
            display: inline-block;
            font-size: .65rem;
            letter-spacing: .15em;
            text-transform: uppercase;
            color: var(--petal);
            margin-bottom: .6rem
        }

        /* LIGHTBOX TRIGGER STYLING */
        /* Any element with data-lightbox becomes clickable */
        [data-lightbox] {
            cursor: zoom-in;
            position: relative
        }

        [data-lightbox]::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(61, 74, 46, 0);
            transition: background .3s;
            pointer-events: none
        }

        [data-lightbox]:hover::after {
            background: rgba(61, 74, 46, .22)
        }

        .lb-zoom {
            position: absolute;
            bottom: .8rem;
            right: .8rem;
            width: 32px;
            height: 32px;
            background: rgba(245, 240, 232, .9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity .25s;
            z-index: 2;
            pointer-events: none
        }

        .lb-zoom svg {
            width: 14px;
            height: 14px;
            stroke: var(--moss)
        }

        [data-lightbox]:hover .lb-zoom {
            opacity: 1
        }

        /* OCCASIONS */
        #occasions {
            background: var(--linen)
        }

        .occasions-intro {
            max-width: 50ch;
            margin-bottom: 4rem
        }

        .occasions-tabs {
            display: flex;
            border-bottom: 1px solid var(--mist);
            margin-bottom: 3rem
        }

        .tab-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Jost', sans-serif;
            font-size: .75rem;
            letter-spacing: .15em;
            text-transform: uppercase;
            color: var(--sage);
            padding: .8rem 1.8rem;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all .2s;
            white-space: nowrap
        }

        .tab-btn.active {
            color: var(--moss);
            border-bottom-color: var(--moss)
        }

        .tab-btn:hover {
            color: var(--moss)
        }

        .tab-panel {
            display: none
        }

        .tab-panel.active {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center
        }

        .tab-img {
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden
        }

        .tab-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .tab-img-placeholder {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: var(--sage);
            opacity: .4
        }

        .tab-text h3 {
            font-size: 2rem;
            color: var(--moss);
            margin-bottom: 1rem
        }

        .tab-text p {
            color: var(--sage);
            line-height: 1.8;
            margin-bottom: 1.5rem
        }

        .tab-img.weddings {
            background: linear-gradient(135deg, #c5ceba, #dde3d4)
        }

        .tab-img.christmas {
            background: linear-gradient(135deg, #b8c4a8, #d4dfc8)
        }

        .tab-img.seasonal {
            background: linear-gradient(135deg, #cfc4a8, #e5dcc9)
        }

        .tab-img.corporate {
            background: linear-gradient(135deg, #c4b8a8, #ddd4c5)
        }

        .tab-img.funerals {
            background: linear-gradient(135deg, #b8bec4, #d0d5dc)
        }

        /* INSTAGRAM */
        #instagram {
            background: var(--white);
            text-align: center
        }

        .instagram-header {
            margin-bottom: 3rem
        }

        .instagram-handle {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            font-size: .8rem;
            letter-spacing: .12em;
            color: var(--sage);
            text-decoration: none;
            text-transform: uppercase;
            margin-top: 1rem;
            transition: color .2s
        }

        .instagram-handle:hover {
            color: var(--moss)
        }

        .instagram-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            margin-bottom: 2.5rem
        }

        .insta-post {
            aspect-ratio: 1;
            background: var(--linen);
            position: relative;
            overflow: hidden
        }

        .insta-post img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .insta-post:nth-child(1) {
            background: linear-gradient(135deg, #c5ceba, #dde3d4)
        }

        .insta-post:nth-child(2) {
            background: linear-gradient(135deg, #cfc4a8, #e5dcc9)
        }

        .insta-post:nth-child(3) {
            background: linear-gradient(135deg, #b8c4a8, #d4dfc8)
        }

        .insta-post:nth-child(4) {
            background: linear-gradient(135deg, #c4b8a8, #ddd4c5)
        }

        .insta-post:nth-child(5) {
            background: linear-gradient(135deg, #b8bec4, #d0d5dc)
        }

        .insta-post:nth-child(6) {
            background: linear-gradient(135deg, #cfc4a8, #e5dcc9)
        }

        .insta-post:nth-child(7) {
            background: linear-gradient(135deg, #c5ceba, #dde3d4)
        }

        .insta-post:nth-child(8) {
            background: linear-gradient(135deg, #b8c4a8, #d4dfc8)
        }

        .insta-post:nth-child(9) {
            background: linear-gradient(135deg, #c4b8a8, #ddd4c5)
        }

        .insta-post:nth-child(10) {
            background: linear-gradient(135deg, #b8bec4, #d0d5dc)
        }

        .insta-note {
            font-size: .78rem;
            color: var(--petal);
            letter-spacing: .05em;
            max-width: 55ch;
            margin: 0 auto;
            line-height: 1.7
        }

        /* CONTACT */
        #contact {
            background: var(--moss);
            color: var(--cream);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5rem;
            align-items: center
        }

        #contact .section-label {
            color: var(--mist);
            opacity: .7
        }

        #contact .section-title {
            color: var(--cream)
        }

        #contact .divider {
            background: rgba(184, 196, 168, .3)
        }

        #contact .section-body {
            color: var(--mist)
        }

        .contact-details {
            margin-top: 2rem
        }

        .contact-details p {
            font-size: .9rem;
            color: var(--mist);
            margin-bottom: .8rem
        }

        .contact-details strong {
            font-weight: 500;
            color: var(--cream)
        }

        .contact-form {
            padding: 3rem;
            background: rgba(255, 255, 255, .05)
        }

        .form-group {
            margin-bottom: 1.5rem
        }

        .form-group label {
            display: block;
            font-size: .7rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--mist);
            margin-bottom: .5rem
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            background: rgba(255, 255, 255, .07);
            border: 1px solid rgba(184, 196, 168, .2);
            color: var(--cream);
            padding: .8rem 1rem;
            font-family: 'Jost', sans-serif;
            font-size: .9rem;
            font-weight: 300;
            outline: none;
            transition: border-color .2s;
            -webkit-appearance: none;
            appearance: none
        }

        .form-group select option {
            background: var(--moss)
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(184, 196, 168, .4)
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--mist)
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px
        }

        .btn-submit {
            width: 100%;
            background: var(--cream);
            color: var(--moss);
            border: none;
            cursor: pointer;
            padding: 1rem;
            font-family: 'Jost', sans-serif;
            font-size: .78rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            transition: background .3s
        }

        .btn-submit:hover {
            background: var(--mist)
        }

        /* FOOTER */
        footer {
            background: var(--earth);
            color: var(--mist);
            padding: 2.5rem 6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: .75rem;
            letter-spacing: .08em
        }

        .footer-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            color: var(--cream);
            letter-spacing: .15em
        }

        .footer-links {
            display: flex;
            gap: 2rem;
            list-style: none
        }

        .footer-links a {
            text-decoration: none;
            color: var(--mist);
            transition: color .2s;
            opacity: .7
        }

        .footer-links a:hover {
            color: var(--cream);
            opacity: 1
        }

        /* ANIMATIONS */
        .fade-up {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity .7s ease, transform .7s ease
        }

        .fade-up.visible {
            opacity: 1;
            transform: translateY(0)
        }

        .fade-up:nth-child(2) {
            transition-delay: .1s
        }

        .fade-up:nth-child(3) {
            transition-delay: .2s
        }

        .fade-up:nth-child(4) {
            transition-delay: .3s
        }

        .fade-up:nth-child(5) {
            transition-delay: .4s
        }

        /* ==========================================
       LIGHTBOX
       ========================================== */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity .35s ease
        }

        .lightbox.open {
            opacity: 1;
            visibility: visible;
            background: rgba(26, 20, 12, .93)
        }

        .lightbox-backdrop {
            position: absolute;
            inset: 0;
            cursor: zoom-out
        }

        .lightbox-content {
            position: relative;
            z-index: 1;
            max-width: min(90vw, 1100px);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(.93) translateY(10px);
            transition: transform .35s cubic-bezier(.34, 1.3, .64, 1)
        }

        .lightbox.open .lightbox-content {
            transform: scale(1) translateY(0)
        }

        .lightbox-img-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            max-height: 80vh
        }

        .lightbox-img-wrap img {
            max-width: min(90vw, 1100px);
            max-height: 80vh;
            object-fit: contain;
            display: block
        }

        .lightbox-placeholder {
            width: min(72vw, 640px);
            aspect-ratio: 4/3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            border: 1px solid rgba(184, 196, 168, .15)
        }

        .lightbox-placeholder svg {
            width: 48px;
            height: 48px;
            opacity: .25
        }

        .lightbox-placeholder p {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: rgba(184, 196, 168, .5);
            font-size: 1rem;
            text-align: center;
            padding: 0 2rem
        }

        .lightbox-caption {
            margin-top: 1rem;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: rgba(184, 196, 168, .65);
            letter-spacing: .04em;
            text-align: center
        }

        .lightbox-close {
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(184, 196, 168, .7);
            font-size: .78rem;
            display: flex;
            align-items: center;
            gap: .5rem;
            font-family: 'Jost', sans-serif;
            letter-spacing: .12em;
            text-transform: uppercase;
            transition: color .2s;
            z-index: 2
        }

        .lightbox-close:hover {
            color: var(--cream)
        }

        .lightbox-close svg {
            width: 16px;
            height: 16px
        }

        .lightbox-prev,
        .lightbox-next {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(245, 240, 232, .07);
            border: 1px solid rgba(184, 196, 168, .15);
            color: rgba(184, 196, 168, .8);
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s, color .2s;
            z-index: 2
        }

        .lightbox-prev {
            left: 1.5rem
        }

        .lightbox-next {
            right: 1.5rem
        }

        .lightbox-prev:hover,
        .lightbox-next:hover {
            background: rgba(245, 240, 232, .15);
            color: var(--cream)
        }

        .lightbox-prev svg,
        .lightbox-next svg {
            width: 20px;
            height: 20px
        }

        .lightbox-counter {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Jost', sans-serif;
            font-size: .7rem;
            letter-spacing: .2em;
            color: rgba(184, 196, 168, .4);
            text-transform: uppercase
        }

        .lightbox.single .lightbox-prev,
        .lightbox.single .lightbox-next,
        .lightbox.single .lightbox-counter {
            display: none
        }

        body.i18n-loading {
            visibility: hidden
        }

        /* TABLET */
        @media(max-width:1100px) {
            nav {
                padding: 1.2rem 2.5rem
            }

    <script src="https://cdnjs.cloudflare.com/ajax/libs/i18next/23.11.5/i18next.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/i18next-http-backend/2.5.2/i18nextHttpBackend.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/i18next-browser-languagedetector/8.0.0/i18nextBrowserLanguageDetector.min.js"></script>
    <script>
        // ─── i18next ───────────────────────────────────────────────────────────────
        i18next
            .use(i18nextHttpBackend)
            .use(i18nextBrowserLanguageDetector)
            .init({
                fallbackLng: 'nl', supportedLngs: ['nl', 'en', 'fr'], nonExplicitSupportedLngs: true,
                backend: { loadPath: '/locales/{{lng}}.json' },
                detection: { order: ['localStorage', 'navigator'], lookupLocalStorage: 'botanick-lang', caches: ['localStorage'] }
            }, function () { renderAll(); document.body.classList.remove('i18n-loading'); });

        function renderAll() {
            const lng = i18next.language;
            document.documentElement.lang = lng;
            document.title = i18next.t('page.title');
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lng));
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.getAttribute('data-i18n').split(';').map(s => s.trim()).forEach(binding => {
                    const m = binding.match(/^\[(\w+)\](.+)$/);
                    const mod = m ? m[1] : 'text', key = m ? m[2] : binding, val = i18next.t(key);
                    if (mod === 'html') el.innerHTML = val;
                    else if (mod === 'placeholder') el.placeholder = val;
                    else el.textContent = val;
                });
            });
            const labels = { nl: 'Sluiten', en: 'Close', fr: 'Fermer' };
            document.getElementById('lb-close-label').textContent = labels[lng] || 'Sluiten';
        }
        document.querySelectorAll('.lang-btn').forEach(btn =>
            btn.addEventListener('click', () => i18next.changeLanguage(btn.dataset.lang, renderAll))
        );

        // ─── NAV SCROLL ────────────────────────────────────────────────────────────
        window.addEventListener('scroll', () =>
            document.getElementById('main-nav').classList.toggle('scrolled', scrollY > 50)
        );

        // ─── FADE-UP ───────────────────────────────────────────────────────────────
        new IntersectionObserver(
            entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }),
            { threshold: 0.1 }
        ).observe && document.querySelectorAll('.fade-up').forEach(el =>
            new IntersectionObserver(
                entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }),
                { threshold: 0.1 }
            ).observe(el)
        );

        // ─── OCCASION TABS ─────────────────────────────────────────────────────────
        document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        }));

        // ─── HAMBURGER ─────────────────────────────────────────────────────────────
        const hbBtn = document.getElementById('hamburger');
        const drawer = document.getElementById('mobile-drawer');
        hbBtn.addEventListener('click', () => {
            const open = drawer.classList.toggle('open');
            hbBtn.classList.toggle('open', open);
            hbBtn.setAttribute('aria-expanded', open);
            document.body.style.overflow = open ? 'hidden' : '';
        });
        function closeDrawer() {
            drawer.classList.remove('open'); hbBtn.classList.remove('open');
            hbBtn.setAttribute('aria-expanded', 'false'); document.body.style.overflow = '';
        }

        // ─── LIGHTBOX ──────────────────────────────────────────────────────────────
        //
        // HOW IT WORKS
        // Any element with data-lightbox="groupName" becomes clickable.
        // The lightbox reads the <img> src/alt from inside that element automatically.
        // Just drop your images in — no extra attributes needed.
        //
        // GROUPING: elements sharing the same data-lightbox value are navigable
        // with prev/next arrows. Use different group names for portfolio vs occasions.
        //
        const lb = document.getElementById('lightbox');
        const lbWrap = document.getElementById('lb-img-wrap');
        const lbCap = document.getElementById('lb-caption');
        const lbCount = document.getElementById('lb-counter');
        const lbPrev = document.getElementById('lb-prev');
        const lbNext = document.getElementById('lb-next');

        let lbGroup = [];  // current group of elements
        let lbIdx = 0;   // current index within group

        // Delegate click on any [data-lightbox] element
        document.addEventListener('click', e => {
            const trigger = e.target.closest('[data-lightbox]');
            if (!trigger || lb.contains(e.target)) return;
            const groupName = trigger.dataset.lightbox;
            lbGroup = Array.from(document.querySelectorAll(`[data-lightbox="${groupName}"]`));
            lbIdx = lbGroup.indexOf(trigger);
            openLb();
        });

        function openLb() {
            renderSlide();
            lb.classList.add('open');
            lb.classList.toggle('single', lbGroup.length <= 1);
            document.body.style.overflow = 'hidden';
            lb.focus();
        }

        function closeLb() {
            lb.classList.remove('open');
            document.body.style.overflow = '';
            // return focus to the element that was clicked
            if (lbGroup[lbIdx]) lbGroup[lbIdx].focus();
        }

        function renderSlide() {
            const el = lbGroup[lbIdx];
            // Read image from nested <img> if present
            const img = el ? el.querySelector('img') : null;
            const src = img ? img.src : '';
            const alt = img ? (img.alt || '') : '';

            lbWrap.innerHTML = '';

            if (src) {
                const i = document.createElement('img');
                i.src = src; i.alt = alt;
                lbWrap.appendChild(i);
            } else {
                // Friendly placeholder while real images are not yet added
                lbWrap.innerHTML = `
        <div class="lightbox-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="#b8c4a8" stroke-width="1">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <p>Voeg een afbeelding toe via een &lt;img&gt; tag binnen dit element.</p>
        </div>`;
            }

            lbCap.textContent = alt;
            lbCount.textContent = lbGroup.length > 1 ? (lbIdx + 1) + ' / ' + lbGroup.length : '';
        }

        function lbGo(dir) {
            lbIdx = (lbIdx + dir + lbGroup.length) % lbGroup.length;
            // Animate out, swap, animate in
            lbWrap.style.opacity = '0';
            setTimeout(() => { renderSlide(); lbWrap.style.opacity = '1'; }, 150);
        }
        lbWrap.style.transition = 'opacity .15s ease';

        lbPrev.addEventListener('click', () => lbGo(-1));
        lbNext.addEventListener('click', () => lbGo(1));
        document.getElementById('lb-backdrop').addEventListener('click', closeLb);
        document.getElementById('lb-close').addEventListener('click', closeLb);

        // Keyboard
        document.addEventListener('keydown', e => {
            if (lb.classList.contains('open')) {
                if (e.key === 'Escape') closeLb();
                if (e.key === 'ArrowLeft') lbGo(-1);
                if (e.key === 'ArrowRight') lbGo(1);
            } else {
                if (e.key === 'Escape') closeDrawer();
            }
        });

        // Touch / swipe
        let tx = 0;
        lb.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
        lb.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - tx;
            if (Math.abs(dx) > 50) lbGo(dx < 0 ? 1 : -1);
        }, { passive: true });

        // ─── INSTAGRAM GRID ────────────────────────────────────────────────────────
        function buildMockGrid() {
            const grid = document.getElementById('ig-grid');
            grid.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const post = document.createElement('div');
                post.className = 'insta-post';
                post.setAttribute('data-lightbox', 'instagram');
                // When you have real images, just set an <img> inside each post.
                // The lightbox will find it automatically.
                post.innerHTML = `
        <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#7a8c6a" stroke-width="1.2" width="28" height="28" style="opacity:.2">
            <rect x="3" y="3" width="18" height="18" rx="4"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17" cy="7" r="1.2" fill="#7a8c6a" stroke="none"/>
          </svg>
        </div>
        <div class="lb-zoom" style="opacity:0;transition:opacity .25s">
          <svg viewBox="0 0 24 24" fill="none" stroke="#3d4a2e" stroke-width="2" width="14" height="14">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </div>`;
                post.addEventListener('mouseenter', () => post.querySelector('.lb-zoom').style.opacity = '1');
                post.addEventListener('mouseleave', () => post.querySelector('.lb-zoom').style.opacity = '0');
                grid.appendChild(post);
            }
        }

        /*
        // LIVE INSTAGRAM FEED — uncomment once your /api/instagram proxy is ready
        async function loadInstagramFeed() {
          const grid = document.getElementById('ig-grid');
          try {
            const data = await fetch('/api/instagram').then(r => r.json());
            (data.data || []).slice(0, 10).forEach(post => {
              const src = post.media_type === 'VIDEO' ? post.thumbnail_url : post.media_url;
              const el  = document.createElement('div');
              el.className = 'insta-post';
              el.setAttribute('data-lightbox', 'instagram');
              el.innerHTML = `<img src="${src}" alt="@botanick" />
                              <div class="lb-zoom"><svg viewBox="0 0 24 24" fill="none" stroke="#3d4a2e" stroke-width="2" width="14" height="14"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>`;
              grid.appendChild(el);
            });
          } catch(_) { buildMockGrid(); }
        }
        loadInstagramFeed();
        */
        buildMockGrid();

        // ─── CONTACT FORM ──────────────────────────────────────────────────────────
        function handleFormSubmit(e) {
            e.preventDefault();
            alert(i18next.t('form.successMsg'));
        }
    </script>
